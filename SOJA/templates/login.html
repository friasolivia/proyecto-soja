<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso — Proyecto Soja</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background-color: #F5F4F0;
            color: #181818;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .login-wrapper {
            width: 100%;
            max-width: 980px;
            background: #FFFFFF;
            border-radius: 24px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1.15fr 1fr;
            box-shadow: 0 20px 50px rgba(0,0,0,0.06);
        }
        .hero-side {
            background: linear-gradient(180deg, rgba(20,20,20,0.35) 0%, rgba(20,20,20,0.75) 100%),
                        url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
            padding: 48px;
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 540px;
        }
        .brand-pill {
            display: inline-block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(255,255,255,0.18);
            backdrop-filter: blur(6px);
            width: fit-content;
        }
        .hero-title {
            font-size: 3.4rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 0.95;
            margin-bottom: 16px;
        }
        .hero-sub {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.85);
            max-width: 340px;
            line-height: 1.5;
        }
        .form-side {
            padding: 56px 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .form-kicker {
            font-size: 0.78rem;
            color: #7A7974;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 8px;
        }
        .form-heading {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 32px;
        }
        .field { margin-bottom: 20px; }
        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: #4A4945;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid #E2E0D8;
            border-radius: 12px;
            background: #FAF9F6;
            font-family: inherit;
            font-size: 0.95rem;
            color: #181818;
            transition: border-color 0.2s, background 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #181818;
            background: #FFFFFF;
        }
        .btn-pill {
            width: 100%;
            margin-top: 12px;
            padding: 15px 24px;
            border: none;
            border-radius: 999px;
            background: #1C1C1C;
            color: #FFFFFF;
            font-family: inherit;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, background 0.2s;
        }
        .btn-pill:hover {
            background: #333333;
            transform: translateY(-1px);
        }
        .error-box {
            margin-bottom: 20px;
            padding: 12px 16px;
            border-radius: 12px;
            background: #FDF2F2;
            border: 1px solid #F5C6CB;
            color: #9B1C1C;
            font-size: 0.85rem;
        }
        @media (max-width: 768px) {
            .login-wrapper { grid-template-columns: 1fr; }
            .hero-side { min-height: 260px; padding: 32px; }
            .hero-title { font-size: 2.5rem; }
            .form-side { padding: 36px 28px; }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="hero-side">
            <span class="brand-pill">Campaña Agrícola 2026/27</span>
            <div>
                <div class="hero-title">soja—space</div>
                <p class="hero-sub">Monitoreo de lotes, auditoría de labores e indicadores agronómicos para la toma de decisiones en tiempo real.</p>
            </div>
        </div>
        <div class="form-side">
            <span class="form-kicker">Autenticación de Operador</span>
            <h1 class="form-heading">Ingresar al panel</h1>

            {% if error %}
            <div class="error-box">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/login">
                <div class="field">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" placeholder="Ej. olivia" required>
                </div>
                <div class="field">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••" required>
                </div>
                <button type="submit" class="btn-pill">Acceder al tablero</button>
            </form>
        </div>
    </div>
</body>
</html>
